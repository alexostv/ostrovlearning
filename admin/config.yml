# =====================================================
# Конфигурация Decap CMS для курса испанского
# Документация: https://decapcms.org/docs/
# =====================================================

backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'Создан {{collection}} "{{slug}}"'
    update: 'Обновлён {{collection}} "{{slug}}"'
    delete: 'Удалён {{collection}} "{{slug}}"'
    uploadMedia: 'Загружен файл "{{path}}"'
    deleteMedia: 'Удалён файл "{{path}}"'

# Папки для медиа-файлов (картинки, аудио)
media_folder: "media"
public_folder: "/media"

# Язык интерфейса админки
locale: "ru"

# Открывать новые редакторы во вкладке а не в модалке (удобнее для длинных модулей)
editor:
  preview: false

# =====================================================
# Коллекции — что можно редактировать
# =====================================================
collections:

  # ----- Модули курса -----
  - name: "modules"
    label: "Модули"
    label_singular: "Модуль"
    description: "Уроки курса. Каждый модуль состоит из теории и упражнений."
    folder: "content/modules"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.id}}"
    identifier_field: "id"
    summary: "{{level}} · {{title}}"
    sortable_fields: ["level", "order", "title"]
    view_groups:
      - label: "По уровню"
        field: "level"
    fields:
      - label: "Идентификатор"
        name: "id"
        widget: "string"
        hint: "Уникальный ID модуля. Рекомендуемый формат: A0-03-numeros (уровень-номер-латинское-название). Используется в URL и для имени файла. Используй только латиницу, цифры и дефисы."

      - label: "Уровень"
        name: "level"
        widget: "select"
        options: ["A0", "A1", "A2", "B1", "B2", "C1", "C2"]
        default: "A0"

      - label: "Порядковый номер"
        name: "order"
        widget: "number"
        value_type: "int"
        min: 1
        default: 1
        hint: "Используется для сортировки модулей одного уровня."

      - label: "Заголовок"
        name: "title"
        widget: "string"
        hint: "Видят ученики на главной и в шапке модуля."

      - label: "Подзаголовок"
        name: "subtitle"
        widget: "string"
        required: false
        hint: "Короткое описание под заголовком (опционально)."

      - label: "Время изучения (минуты)"
        name: "estimated_minutes"
        widget: "number"
        value_type: "int"
        min: 1
        default: 15
        required: false

      # ----- ТЕОРИЯ -----
      - label: "Теория"
        name: "theory"
        widget: "markdown"
        required: false
        hint: |
          Пиши теорию как обычный текст. Используй панель сверху для заголовков, списков, таблиц, жирного, курсива.
          Картинки — перетащи прямо в редактор.
          Выноски (цветные блоки с советом/предупреждением) пиши так:
          > [!TIP] Полезный совет (зелёный)
          > [!WARNING] Предупреждение (жёлтый)
          > [!INFO] Информация (синий)

      # ----- АУДИО -----
      - label: "Аудио к уроку"
        name: "audio_files"
        widget: "list"
        required: false
        summary: "🔊 {{fields.caption}}"
        hint: "Аудио-файлы появятся отдельным блоком после теории, перед упражнениями."
        fields:
          - { label: "Аудио-файл", name: "src", widget: "file" }
          - { label: "Описание", name: "caption", widget: "string", required: false }

      # ----- УПРАЖНЕНИЯ -----
      - label: "Упражнения"
        name: "exercises"
        widget: "list"
        types_label: "Тип упражнения"
        types:
          - label: "Тест с выбором ответа"
            name: "multiple-choice"
            widget: "object"
            summary: "✓ {{fields.question}}"
            fields:
              - { label: "type", name: "type", widget: "hidden", default: "multiple-choice" }
              - { label: "ID упражнения", name: "id", widget: "string", hint: "Уникальный в рамках модуля. Например ex1, ex2." }
              - { label: "Вопрос", name: "question", widget: "text" }
              - label: "Варианты ответов"
                name: "options"
                widget: "list"
                summary: "{{fields.text}}"
                fields:
                  - { label: "Текст варианта", name: "text", widget: "string" }
                  - { label: "Правильный ответ", name: "correct", widget: "boolean", default: false }
              - { label: "Можно выбрать несколько", name: "multiple", widget: "boolean", default: false, required: false, hint: "Включи если правильных ответов больше одного." }
              - { label: "Объяснение (показывается после ответа)", name: "explanation", widget: "text", required: false }

          - label: "Заполнение пропуска"
            name: "fill-blank"
            widget: "object"
            summary: "✏ {{fields.sentence}}"
            fields:
              - { label: "type", name: "type", widget: "hidden", default: "fill-blank" }
              - { label: "ID упражнения", name: "id", widget: "string" }
              - { label: "Текст задания", name: "question", widget: "text", required: false, hint: "Что нужно сделать (например: 'Вставь нужное слово'). Опционально." }
              - { label: "Предложение с пропуском", name: "sentence", widget: "string", hint: "Используй ___ (три подчёркивания подряд) для обозначения пропуска. Пример: '¡___! ¿Cómo estás?'" }
              - label: "Допустимые ответы"
                name: "answers"
                widget: "list"
                hint: "Все варианты которые засчитываются как правильные. Например: 'Hola' и 'hola'."
                field: { label: "Ответ", name: "answer", widget: "string" }
              - { label: "Подсказка ученику", name: "hint", widget: "string", required: false }
              - { label: "Учитывать регистр", name: "case_sensitive", widget: "boolean", default: false, required: false, hint: "Если выключено: Hola = hola = HOLA" }
              - { label: "Объяснение", name: "explanation", widget: "text", required: false }

          - label: "Сопоставление пар"
            name: "matching"
            widget: "object"
            summary: "⇄ {{fields.question}}"
            fields:
              - { label: "type", name: "type", widget: "hidden", default: "matching" }
              - { label: "ID упражнения", name: "id", widget: "string" }
              - { label: "Текст задания", name: "question", widget: "text", required: false }
              - label: "Пары соответствия"
                name: "pairs"
                widget: "list"
                summary: "{{fields.left}} ⇄ {{fields.right}}"
                hint: "Каждая пара — то что должно соединиться. Левая колонка перемешивается со ВСЕМИ правыми элементами, ученик соединяет их."
                fields:
                  - { label: "Слева", name: "left", widget: "string" }
                  - { label: "Справа", name: "right", widget: "string" }
              - { label: "Объяснение", name: "explanation", widget: "text", required: false }

  # ----- Настройки курса (один файл) -----
  - name: "course"
    label: "Настройки курса"
    description: "Общие настройки и список уровней."
    files:
      - file: "content/courses.json"
        label: "Манифест курса"
        name: "manifest"
        format: "json"
        fields:
          - { label: "Название курса", name: "title", widget: "string" }
          - { label: "Подзаголовок", name: "subtitle", widget: "string", required: false }
          - { label: "Автор", name: "author", widget: "string", required: false }
          - { label: "Описание курса", name: "description", widget: "text", required: false }
          - label: "Уровни"
            name: "levels"
            widget: "list"
            summary: "{{fields.id}} — {{fields.title}}"
            fields:
              - { label: "ID уровня", name: "id", widget: "string", hint: "Например A0, A1, B1" }
              - { label: "Название уровня", name: "title", widget: "string" }
              - { label: "Описание уровня", name: "description", widget: "text", required: false }
              - label: "Модули в этом уровне"
                name: "modules"
                widget: "list"
                hint: "Список ID модулей в нужном порядке. ID должен совпадать с ID модуля в коллекции 'Модули'."
                field:
                  label: "ID модуля"
                  name: "module"
                  widget: "string"
