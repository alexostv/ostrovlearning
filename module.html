<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Модуль · Курс испанского</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

<header class="bg-white border-b border-gray-200">
  <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
    <a href="index.html" class="text-xl font-bold" style="font-family: Lora, serif;">
      <span style="color: var(--color-accent);">¡Español!</span>
    </a>
    <nav class="flex gap-4 text-sm">
      <a href="index.html" class="text-gray-700 hover:text-orange-700">← Все модули</a>
    </nav>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-8">

  <div id="module-header" class="mb-8">
    <p class="text-gray-500">Загрузка модуля...</p>
  </div>

  <article id="theory" class="theory-content prose-base mb-12"></article>

  <section id="exercises-section" class="mt-12">
    <h2 class="text-2xl font-bold mb-2" style="font-family: Lora, serif;">Упражнения</h2>
    <p class="text-gray-600 mb-6">Закрепи материал. Прогресс сохраняется автоматически в этом браузере.</p>
    <div id="exercises-list"></div>
  </section>

  <section id="completion-banner" class="mt-12 hidden">
    <!-- Показывается когда все упражнения выполнены правильно -->
  </section>

  <section class="mt-12 pt-6 border-t border-gray-200 flex items-center justify-between text-sm">
    <a href="index.html" class="text-gray-500 hover:text-orange-700">← Все модули</a>
    <a id="next-module-link" href="#" class="text-orange-700 hover:underline hidden">Следующий модуль →</a>
  </section>

</main>

<footer class="border-t border-gray-200 mt-12 py-6 text-center text-sm text-gray-400">
  <p>Прогресс сохраняется в твоём браузере (localStorage).</p>
</footer>

<script src="assets/app.js"></script>
<script src="assets/exercises.js"></script>
<script>
let currentModuleData = null;
let currentCourse = null;

async function init() {
  const headerEl = document.getElementById('module-header');
  const theoryEl = document.getElementById('theory');
  const exercisesEl = document.getElementById('exercises-list');

  const moduleId = getQueryParam('id');
  if (!moduleId) {
    showError(headerEl, 'Модуль не указан в URL.');
    return;
  }

  // Загружаем курс (для навигации) и модуль
  try {
    [currentCourse, currentModuleData] = await Promise.all([
      loadCourse(),
      loadModule(moduleId),
    ]);
  } catch (e) {
    showError(headerEl, e.message);
    return;
  }

  document.title = `${currentModuleData.title} · Курс испанского`;

  // Заголовок модуля
  headerEl.innerHTML = `
    <a href="index.html" class="text-sm text-gray-500 hover:text-orange-700">← К списку модулей</a>
    <div class="flex items-center gap-2 mt-3 mb-2">
      <span class="badge badge-level">${escapeHtml(currentModuleData.level || '')}</span>
      ${currentModuleData.estimated_minutes ? `<span class="text-xs text-gray-400">~ ${currentModuleData.estimated_minutes} мин</span>` : ''}
    </div>
    <h1 class="text-3xl md:text-4xl font-bold" style="font-family: Lora, serif;">
      ${escapeHtml(currentModuleData.title)}
    </h1>
    ${currentModuleData.subtitle ? `<p class="text-lg text-gray-600 mt-2">${escapeHtml(currentModuleData.subtitle)}</p>` : ''}
  `;

  // Теория
  theoryEl.innerHTML = renderTheory(currentModuleData.theory || []);

  // Упражнения
  if (!currentModuleData.exercises || currentModuleData.exercises.length === 0) {
    document.getElementById('exercises-section').classList.add('hidden');
  } else {
    currentModuleData.exercises.forEach((ex, idx) => {
      const node = renderExercise(currentModuleData.id, ex, idx);
      exercisesEl.appendChild(node);
    });
  }

  // Слушаем завершение упражнений, обновляем прогресс
  document.addEventListener('exercise-completed', () => {
    updateModuleProgress();
  });

  updateModuleProgress();
  setupNextModuleLink();
}

function updateModuleProgress() {
  const progress = calculateModuleProgress(currentModuleData);
  const banner = document.getElementById('completion-banner');

  if (progress.total > 0 && progress.done === progress.total && !banner.dataset.shown) {
    markModuleCompleted(currentModuleData.id);
    banner.classList.remove('hidden');
    banner.innerHTML = `
      <div class="bg-green-50 border-l-4 border-green-600 rounded-lg p-6">
        <h3 class="text-xl font-bold text-green-800 mb-1">¡Bien hecho!</h3>
        <p class="text-green-700">Ты прошёл все упражнения этого модуля. Можно двигаться дальше.</p>
      </div>
    `;
    banner.dataset.shown = '1';
  }
}

function setupNextModuleLink() {
  if (!currentCourse || !currentModuleData) return;

  // Найти все модули в порядке курса
  const ordered = [];
  for (const level of currentCourse.levels || []) {
    for (const id of level.modules || []) {
      ordered.push(id);
    }
  }
  const idx = ordered.indexOf(currentModuleData.id);
  if (idx >= 0 && idx < ordered.length - 1) {
    const nextId = ordered[idx + 1];
    const link = document.getElementById('next-module-link');
    link.href = `module.html?id=${encodeURIComponent(nextId)}`;
    link.classList.remove('hidden');
  }
}

init();
</script>

</body>
</html>
